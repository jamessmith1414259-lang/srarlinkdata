<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARLINK - M-Pesa Checkout</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      background: #00051a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: url('https://postimg.cc') center/cover no-repeat;
      opacity: 0.3;
      z-index: -1;
    }
    .card {
      background: rgba(0, 20, 50, 0.92);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      padding: 28px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #008cff;
      text-shadow: 0 0 10px #008cff;
    }
    .summary {
      background: rgba(0, 5, 26, 0.85);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #008cff;
    }
    .summary p {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
    }
    #displayPlan { color: #00ff66; }
    #displayAmountWrap { color: #00f0ff; }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #00f0ff;
      background: #00051a;
      color: #fff;
      font-size: 16px;
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #00ff66;
      color: #00051a;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #ffffff; }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .status.info { display: block; background: rgba(0, 140, 255, 0.25); border: 1px solid #008cff; color: #bae6fd; }
    .status.success { display: block; background: rgba(0, 255, 102, 0.2); border: 1px solid #00ff66; color: #bbf7d0; }
    .status.error { display: block; background: rgba(239, 68, 68, 0.25); border: 1px solid #ef4444; color: #fecaca; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #00f0ff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="card">
    <h2>M-Pesa Checkout</h2>

    <div class="summary">
      <p><span>Selected Plan:</span> <strong id="displayPlan">-</strong></p>
      <p><span>Amount to Pay:</span> <strong id="displayAmountWrap">KSh <span id="displayAmount">0</span></strong></p>
    </div>

    <form id="checkoutForm">
      <label for="phone">Enter M-Pesa Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="e.g. 0712345678"
        required
      />

      <button type="submit" id="payBtn">Pay Now via M-Pesa</button>
    </form>

    <div id="statusBox" class="status"></div>
    <a href="index.html" class="back-link">← Back to Packages</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const planName = params.get('plan') || params.get('name') || 'No Plan Selected';
    const planPrice = Number(params.get('price') || 0);

    document.getElementById('displayPlan').textContent = planName;
    document.getElementById('displayAmount').textContent = planPrice;

    const form = document.getElementById('checkoutForm');
    const payBtn = document.getElementById('payBtn');
    const statusBox = document.getElementById('statusBox');

    if (planPrice <= 0) {
      payBtn.disabled = true;
      showStatus('error', 'No valid package selected. Please go back and choose a plan.');
    }

    function showStatus(type, text) {
      statusBox.className = 'status ' + type;
      statusBox.textContent = text;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value.trim();

      payBtn.disabled = true;
      showStatus('info', 'Sending M-Pesa prompt to your phone...');

      try {
        const res = await fetch('/api/stkpush', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount: planPrice, plan: planName })
        });

        const data = await res.json();

        if (res.ok && data.ResponseCode === '0') {
          showStatus('info', 'Prompt sent! Check your phone and enter your M-Pesa PIN.');
          pollPaymentStatus(data.CheckoutRequestID);
        } else {
          showStatus('error', data.error || data.errorMessage || 'Failed to initiate payment.');
          payBtn.disabled = false;
        }
      } catch (err) {
        showStatus('error', 'Network error. Please check your connection.');
        payBtn.disabled = false;
      }
    });

    function pollPaymentStatus(checkoutRequestId) {
      let attempts = 0;
      const maxAttempts = 20;

      const interval = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch(`/api/payment-status/${checkoutRequestId}`);
          const result = await res.json();

          if (result.status === 'SUCCESS') {
            clearInterval(interval);
            showStatus('success', result.message + ' Your Starlink bundle is being activated!');
            payBtn.disabled = false;
          } else if (result.status === 'FAILED') {
            clearInterval(interval);
            showStatus('error', result.message);
            payBtn.disabled = false;
          } else if (attempts >= maxAttempts) {
            clearInterval(interval);
            showStatus('error', 'Payment verification timed out. If you paid, please contact support.');
            payBtn.disabled = false;
          }
        } catch (err) {}
      }, 3000);
    }
  </script>
</body>
</html>
