<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Starlink Data</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 28px;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h2 { margin-top: 0; text-align: center; color: #38bdf8; }
    .summary {
      background: #0f172a;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .summary p { margin: 6px 0; display: flex; justify-content: space-between; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .status.info { display: block; background: #1e3a8a; color: #bfdbfe; }
    .status.success { display: block; background: #14532d; color: #bbf7d0; }
    .status.error { display: block; background: #7f1d1d; color: #fecaca; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>M-Pesa Checkout</h2>

    <div class="summary">
      <p><span>Selected Plan:</span> <strong id="displayPlan">Standard Bundle</strong></p>
      <p><span>Amount to Pay:</span> <strong>KES <span id="displayAmount">0</span></strong></p>
    </div>

    <form id="checkoutForm">
      <label for="phone">M-Pesa Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="e.g. 0712345678"
        required
      />

      <label for="amount">Amount (KES)</label>
      <input
        type="number"
        id="amount"
        min="1"
        required
      />

      <button type="submit" id="payBtn">Pay Now via M-Pesa</button>
    </form>

    <div id="statusBox" class="status"></div>
    <a href="index.html" class="back-link">← Back to Plans</a>
  </div>

  <script>
    // Read plan and price from URL (e.g. checkout.html?plan=Daily%205GB&price=100)
    const params = new URLSearchParams(window.location.search);
    const planName = params.get('plan') || 'Starlink Data Bundle';
    const planPrice = params.get('price') || '';

    document.getElementById('displayPlan').textContent = planName;
    const amountInput = document.getElementById('amount');
    const displayAmount = document.getElementById('displayAmount');

    if (planPrice) {
      amountInput.value = planPrice;
      amountInput.readOnly = true;
      displayAmount.textContent = planPrice;
    }

    amountInput.addEventListener('input', () => {
      displayAmount.textContent = amountInput.value || '0';
    });

    const form = document.getElementById('checkoutForm');
    const payBtn = document.getElementById('payBtn');
    const statusBox = document.getElementById('statusBox');

    function showStatus(type, text) {
      statusBox.className = 'status ' + type;
      statusBox.textContent = text;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const amount = amountInput.value;

      payBtn.disabled = true;
      showStatus('info', 'Sending M-Pesa prompt to your phone...');

      try {
        const res = await fetch('/api/stkpush', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount, plan: planName })
        });

        const data = await res.json();

        if (res.ok && data.ResponseCode === '0') {
          showStatus('info', 'Prompt sent! Check your phone and enter your M-Pesa PIN.');
          pollPaymentStatus(data.CheckoutRequestID);
        } else {
          showStatus('error', data.error || data.errorMessage || 'Failed to initiate payment.');
          payBtn.disabled = false;
        }
      } catch (err) {
        showStatus('error', 'Network error. Please check your connection.');
        payBtn.disabled = false;
      }
    });

    // Poll backend every 3 seconds to verify PIN confirmation
    function pollPaymentStatus(checkoutRequestId) {
      let attempts = 0;
      const maxAttempts = 20; // 60 seconds timeout

      const interval = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch(`/api/payment-status/${checkoutRequestId}`);
          const result = await res.json();

          if (result.status === 'SUCCESS') {
            clearInterval(interval);
            showStatus('success', result.message + ' Your Starlink bundle is being activated!');
            payBtn.disabled = false;
          } else if (result.status === 'FAILED') {
            clearInterval(interval);
            showStatus('error', result.message);
            payBtn.disabled = false;
          } else if (attempts >= maxAttempts) {
            clearInterval(interval);
            showStatus('error', 'Payment verification timed out. If you paid, please contact support.');
            payBtn.disabled = false;
          }
        } catch (err) {
          // Ignore transient network errors while polling
        }
      }, 3000);
    }
  </script>
</body>
</html>
