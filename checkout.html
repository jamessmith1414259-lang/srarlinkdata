<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARLINK - M-Pesa Checkout</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      color: #ffffff;
      background-color: #000b29;
      background-image: url('./bg.png');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(0, 20, 50, 0.85);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.45);
      padding: 28px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #00f0ff;
      text-shadow: 0 0 12px #008cff;
    }
    .summary {
      background: rgba(0, 8, 28, 0.82);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #008cff;
    }
    .summary p {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
    }
    #displayPlan { color: #00ff66; }
    #displayAmountWrap { color: #00f0ff; }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #e2e8f0;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #00f0ff;
      background: rgba(0, 5, 26, 0.9);
      color: #fff;
      font-size: 16px;
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #00ff66;
      color: #00051a;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #ffffff; }
    button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #00f0ff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>M-Pesa Checkout</h2>

    <div class="summary">
      <p><span>Selected Plan:</span> <strong id="displayPlan">-</strong></p>
      <p><span>Amount to Pay:</span> <strong id="displayAmountWrap">KSh <span id="displayAmount">0</span></strong></p>
    </div>

    <form id="checkoutForm">
      <label for="phone">Enter M-Pesa Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="e.g. 0712345678"
        required
      />

      <button type="submit" id="payBtn">Pay Now</button>
    </form>

    <a href="index.html" class="back-link">← Back to Packages</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const planName =
      params.get('plan') ||
      params.get('name') ||
      sessionStorage.getItem('selectedPlan') ||
      'No Plan Selected';
    const planPrice = Number(
      params.get('price') ||
      sessionStorage.getItem('selectedPrice') ||
      0
    );

    document.getElementById('displayPlan').textContent = planName;
    document.getElementById('displayAmount').textContent = planPrice;

    const form = document.getElementById('checkoutForm');
    const payBtn = document.getElementById('payBtn');

    if (planPrice <= 0) {
      payBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value.trim();

      payBtn.disabled = true;

      try {
        const res = await fetch('/api/stkpush', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, amount: planPrice, plan: planName })
        });

        const data = await res.json();

        if (res.ok && data.ResponseCode === '0') {
          pollPaymentStatus(data.CheckoutRequestID);
        } else {
          payBtn.disabled = false;
        }
      } catch (err) {
        payBtn.disabled = false;
      }
    });

    function pollPaymentStatus(checkoutRequestId) {
      let attempts = 0;
      const maxAttempts = 20;

      const interval = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch(`/api/payment-status/${checkoutRequestId}`);
          const result = await res.json();

          if (result.status === 'SUCCESS' || result.status === 'FAILED' || attempts >= maxAttempts) {
            clearInterval(interval);
            payBtn.disabled = false;
          }
        } catch (err) {}
      }, 3000);
    }
  </script>
</body>
</html>
