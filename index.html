<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sales</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #00051a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('YOUR_SATELLITE_IMAGE_URL') no-repeat center center fixed;
            background-size: cover;
            opacity: 0.3;
            z-index: -1;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
        }
        .package-slot {
            background: rgba(0, 20, 50, 0.8);
            border: 1px solid #00f0ff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s;
        }
        .package-slot:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="container">
        <!-- Repeat this block for 10 slots -->
        <div class="package-slot">
            <h3>Package 1</h3>
            <p>Description</p>
            <button onclick="console.log('Buy')">Buy Now</button>
        </div>
        <!-- Copy slot 9 more times -->
    </div>
</body>
</html>
