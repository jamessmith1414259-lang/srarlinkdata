<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARLINK DATA SOLUTION</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background-color: #02081a; /* Blends seamlessly with the space edges */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* Shows the entire image without cropping on mobile & desktop */
.bg-image {
    position: fixed;
    inset: 0;
    background: #02081a url('bg.png') center center / contain no-repeat;
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 8, 28, 0.35);
    z-index: -1;
}

.hero {
    text-align: center;
    background: rgba(0, 18, 48, 0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid #00f0ff;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.45);
    border-radius: 16px;
    padding: 36px 28px;
    max-width: 720px;
    width: 95%;
}

h1 {
    margin: 0 0 10px;
    color: #00f0ff;
    text-shadow: 0 0 12px #008cff;
    font-size: 32px;
}

p {
    color: #e2e8f0;
    font-size: 16px;
    margin-bottom: 28px;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
}

.menu-card {
    background: rgba(0, 30, 75, 0.85);
    border: 1px solid #00f0ff;
    border-radius: 12px;
    padding: 22px 16px;
    transition: 0.3s;
}

.menu-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 18px #00f0ff;
}

.menu-card h2 {
    margin: 0 0 14px;
    color: #00ff66;
    font-size: 20px;
}

button {
    background: #00f0ff;
    color: #00051a;
    border: none;
    padding: 11px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    width: 100%;
}

button:hover { background: #ffffff; }
</style>
</head>
<body>

<div class="bg-image"></div>
<div class="overlay"></div>

<div class="hero">
    <h1>STARLINK DATA SOLUTION</h1>
    <p>Choose your preferred data bundle category below for instant M-Pesa activation</p>

    <div class="menu-grid">
        <div class="menu-card">
            <h2>DAILY PLANS</h2>
            <button onclick="location.href='daily.html'">View Daily</button>
        </div>

        <div class="menu-card">
            <h2>WEEKLY PLANS</h2>
            <button onclick="location.href='weekly.html'">View Weekly</button>
        </div>

        <div class="menu-card">
            <h2>MONTHLY PLANS</h2>
            <button onclick="location.href='monthly.html'">View Monthly</button>
        </div>
    </div>
</div>

</body>
</html>
