<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARLINK - Weekly Packages</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background-color: #000b29;
    background-image: url('./bg.png');
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    width: 90%;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.page-title {
    grid-column: 1 / -1;
    text-align: center;
    color: #00f0ff;
    background: rgba(0, 18, 48, 0.8);
    border: 1px solid #00f0ff;
    padding: 14px;
    border-radius: 12px;
    text-shadow: 0 0 12px #008cff;
}

.package-slot {
    background: rgba(0, 20, 50, 0.82);
    border: 1px solid #00f0ff;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    transition: 0.3s;
}

.package-slot:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 18px #00f0ff;
}

.description {
    color: #00ff66;
    font-size: 18px;
    font-weight: bold;
}

.price {
    color: #38bdf8;
    font-size: 22px;
    font-weight: bold;
}

button {
    background: #00f0ff;
    color: #00051a;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover { background: white; }

.back-button {
    grid-column: 1 / -1;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">WEEKLY PACKAGES</h1>

<div class="package-slot">
    <p class="description">3Gb Weekly</p>
    <p class="price">Price: KSh:55</p>
    <button onclick="buyPackage('weekly1', '3Gb ', 55)">Buy Now</button>
</div>

<div class="package-slot">
    <p class="description">10Gb+youtube</p>
    <p class="price">Price: KSh:150</p>
    <button onclick="buyPackage('weekly2', '10Gb+youtube', 150)">Buy Now</button>
</div>

<div class="package-slot">
    <p class="description">20Gb+youtube</p>
    <p class="price">Price: KSh:250</p>
    <button onclick="buyPackage('weekly3', '20Gb+youtube', 250)">Buy Now</button>
</div>

<div class="package-slot">
    <p class="description">30Gb+youtube</p>
    <p class="price">Price: KSh:399</p>
    <button onclick="buyPackage('weekly4', '30Gb+youtube', 399)">Buy Now</button>
</div>

<div class="back-button">
    <button onclick="location.href='index.html'">Back to Home</button>
</div>

</div>

<script>
function buyPackage(id, name, price) {
    sessionStorage.setItem('selectedPlan', name);
    sessionStorage.setItem('selectedPrice', price);
    const params = new URLSearchParams({ package: id, plan: name, price: price });
    location.href = 'checkout.html?' + params.toString();
}
</script>

</body>
</html>
